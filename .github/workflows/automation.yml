name: Zotero to Readwise Automation

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 * * * *" # Runs every hour (Check https://crontab.guru/)
  workflow_dispatch:  # For manual trigger

jobs:
  zotero-to-readwise-automation:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout sync repo
        uses: actions/checkout@v4.2.2

      - name: 📥 Checkout Zotero2Readwise fork
        uses: actions/checkout@v4.2.2
        with:
          repository: bjg83/Zotero2Readwise
          path: Zotero2Readwise

      - name: 🧹 Remove nested .git to prevent submodule warning
        run: rm -rf Zotero2Readwise/.git

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v7.0.0

      - name: 🔄 Sync Zotero to Readwise
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_LIBRARY_ID: ${{ secrets.ZOTERO_ID }}
        run: uvx --from ./Zotero2Readwise zotero2readwise --use_since --batch_size 500 --recent_first y

      - name: 📦 Collect failed Zotero items
        if: always()
        run: |
          failed_items="$(find "$RUNNER_TEMP/setup-uv-cache" -type f \
            -path '*/site-packages/zotero2readwise/failed_zotero_items.json' \
            -print -quit)"
          if [ -n "$failed_items" ]; then
            mkdir -p artifacts
            cp "$failed_items" artifacts/failed_zotero_items.json
            echo "Collected failed items JSON."
          else
            echo "No failed-items JSON was produced."
          fi

      - name: ⬆️ Upload failed Zotero items
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-zotero-items
          path: artifacts/failed_zotero_items.json
          if-no-files-found: warn
          retention-days: 30

      - name: 💾 Save library version for next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add since
          git diff --cached --quiet || git commit -m "chore: update zotero library version after sync"
          git push
