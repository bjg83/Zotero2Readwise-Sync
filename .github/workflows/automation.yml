name: Zotero to Readwise Automation

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 * * * *" # Runs every hour (Check https://crontab.guru/)
  workflow_dispatch:  # For manual trigger

jobs:
  zotero-to-readwise-automation:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 📥 Checkout sync repo
        uses: actions/checkout@v4

      - name: 📥 Checkout Zotero2Readwise fork
        uses: actions/checkout@v4
        with:
          repository: bjg83/Zotero2Readwise
          path: Zotero2Readwise
    
      - name: 🧹 Remove nested .git to prevent submodule warning
        run: rm -rf Zotero2Readwise/.git
    
      - name: 🔧 Apply automation patches (state + upsert + reconcile)
        run: |
          chmod +x patches/apply_patches.sh
          ./patches/apply_patches.sh
    
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v6
    
      - name: 🔄 Sync Zotero to Readwise
        env:
          READWISE_TOKEN: ${{ secrets.READWISE_TOKEN }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_LIBRARY_ID: ${{ secrets.ZOTERO_ID }}
          # Optional override for state DB path (default: ~/.zotero2readwise/state.db)
          ZOTERO2READWISE_STATE_DB: ${{ secrets.ZOTERO2READWISE_STATE_DB }}
          # Enable reconcile mode by default to avoid duplicates (set to false to disable)
          ZOTERO2READWISE_RECONCILE: true
        run: |
          # uvx will use the patched Readwise module copied by apply_patches.sh
          uvx --from ./Zotero2Readwise zotero2readwise --use_since --batch_size 500 --recent_first y
    
      - name: 💾 Save library version for next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add since
          git diff --cached --quiet || git commit -m "chore: update zotero library version after sync"
          git push
